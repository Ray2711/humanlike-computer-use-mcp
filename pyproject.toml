[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "humanlike-computer-use-mcp"
version = "0.1.0"
description = "MCP server exposing computer-use tools (screenshots, mouse, keyboard) with human-like movement and typing."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=2.0",
    "windmouse[pyautogui]",
    "pyautogui>=0.9.54",
    "pynput>=1.7",
    "mss>=9.0",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
humanlike-computer-use-mcp = "humanlike_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: touches the real mouse/screen (opt-in via HUMANLIKE_LIVE_TESTS=1)"]
